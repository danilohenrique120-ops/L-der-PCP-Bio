<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="bioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Silhueta do Biorreator -->
  <path d="M 38 32 C 38 25, 82 25, 82 32 L 82 72 C 82 86, 38 86, 38 72 Z" 
        stroke="url(#bioGrad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.35" />

  <!-- Eixo Superior -->
  <line x1="48" y1="22" x2="72" y2="22" stroke="url(#bioGrad)" stroke-width="4" stroke-linecap="round" />
  <line x1="60" y1="22" x2="60" y2="32" stroke="url(#bioGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Barras do Gantt / PCP Integradas ao Reator -->
  <rect x="46" y="40" width="18" height="6" rx="3" fill="#10B981" filter="url(#glow)" />
  <rect x="46" y="52" width="28" height="6" rx="3" fill="#06B6D4" filter="url(#glow)" />
  <rect x="56" y="64" width="18" height="6" rx="3" fill="#3B82F6" filter="url(#glow)" />

  <!-- Válvula Inferior / Saída de Envase -->
  <circle cx="60" cy="90" r="4" fill="#10B981" />
  <line x1="60" y1="82" x2="60" y2="90" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
</svg>
